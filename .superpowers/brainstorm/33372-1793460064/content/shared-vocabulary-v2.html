<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện từ vựng · Essential Word</title><link rel="stylesheet" href="/files/vocabulary.css"><style>
@font-face{font-family:Vietnam;src:url('/files/font.ttf')}*{box-sizing:border-box}body{margin:0;font-family:Vietnam,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #55754b;outline-offset:3px}.prototype-note{background:#e9eddf;text-align:center;font-size:12px;padding:8px 15px;color:#53634b}.essential{display:inline-block;background:#edf0e4;border:1px solid #bac8ab;color:#49613c;padding:4px 10px;border-radius:4px;font-size:11px;letter-spacing:.03em}.vocab-card{position:relative}.vocab-card .essential{position:absolute;left:14px;top:14px;z-index:1}.vocab-coverArea{width:100%;border:0;font:inherit;color:inherit;cursor:pointer}.vocab-bookCover{text-align:left}.vocab-header button,.vocab-breadcrumb button{background:none;border:0;padding:0}.vocab-header nav button{font-size:13px}.vocab-heroArt small{text-align:center}.study-tabs{flex-wrap:wrap!important;overflow:visible!important}.study-tabs button{white-space:normal}.study-tabs button.extra{border-bottom:2px solid #b5c6a5}.study-tabs button[aria-selected=true]{background:#55754b;color:#fff}.study-panel{margin-bottom:30px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #cbd2bf;border-radius:6px;background:#fdfcf8;padding:10px 16px}.btn.main{background:#55754b;color:white;border-color:#55754b}.btn.chosen{background:#e9eddf;border-color:#55754b}.muted{color:#66715e;font-size:13px}.passage{font:20px/1.9 Georgia,serif;background:#f4f3ec;border-left:3px solid #adbd9d;padding:22px;margin:20px 0}.question{border-top:1px solid #dcded0;padding:18px 0}.question label{display:flex;align-items:center;gap:10px;padding:7px 0}.question input{accent-color:#55754b}.response{padding:14px;background:#e9eddf;border-radius:6px;margin:15px 0}.response.error{background:#f5e9dc;color:#754e34}.families{border-collapse:collapse;width:100%;margin:18px 0}.families th,.families td{padding:12px 8px;text-align:left;border-bottom:1px solid #dcded0}.families td[lang=en]{font:19px Georgia,serif}.field{padding:10px;border:1px solid #bbc7ae;border-radius:6px;background:#fffefb;max-width:100%;min-width:0}.flash{display:grid;place-content:center;text-align:center;min-height:230px;width:100%;background:#edf0e5;border:1px solid #d6deca;border-radius:8px}.flash strong{font:36px Georgia,serif}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.study-panel h2{font-weight:500;margin-top:0}.study-panel details{margin:20px 0}.study-panel summary{cursor:pointer;color:#55754b}.part-photo{width:100%;max-width:440px;aspect-ratio:440/328;overflow:hidden;position:relative;margin:20px auto;background:#e7e7df}.part-photo img{position:absolute;width:203%;max-width:none;left:-86.5%;top:-52.4%;height:auto}.vocab-grid{margin-bottom:35px}[hidden]{display:none!important}@media(max-width:600px){.families th,.families td{padding:8px 4px;font-size:12px}.families td[lang=en]{font-size:16px}.passage{padding:16px;font-size:18px}.study-tabs button{font-size:12px;padding:9px}.vocab-header nav{gap:15px}.vocab-heroArt{display:none}}
</style></head><body><div class="prototype-note">BẢN MẪU · Dùng giao diện /tu-vung · Nội dung bài tập minh họa · Chưa lưu tiến độ</div><div class="vocab-library"><header class="vocab-header"><button class="vocab-brand" id="brand">words<span>.</span></button><nav><button id="home">Danh sách bài</button></nav></header><main id="main"></main><footer class="vocab-footer"><span>Học một chút, nhớ thêm mỗi ngày.</span><span>ENGLISH SPACE / TỪ VỰNG</span></footer></div>
<script>
const root=document.getElementById('main');let isEssential=true,active='list',part=5,listenPart=1,flip=false;let errors=new Set();let wordIndex=0;
const words=[['agreement','sự thỏa thuận; hợp đồng'],['assurance','sự đảm bảo'],['abide by','tuân thủ']];
const core=[['list','Danh sách từ'],['flashcard','Flash Card'],['writing','Writing'],['test','Test'],['history','Lịch sử']];
const extras=[['context','Words in Context'],['families','Word Families'],['reading','Reading'],['listening','Listening'],['review','Word Review']];
function home(){root.innerHTML=`<section class="vocab-hero"><div><p class="vocab-eyebrow">GÓC HỌC TỪ CỦA BẠN</p><h1>Thư viện từ vựng</h1><p class="vocab-subtitle">Thêm một từ mới.<br><em>Mở thêm một cách diễn đạt.</em></p></div><div class="vocab-heroArt" aria-hidden="true"><span>Aa</span><small>MỖI TỪ LÀ MỘT KHỞI ĐẦU</small></div></section><section class="vocab-collection"><div class="vocab-toolbar"><h2>Danh sách bài</h2><label class="vocab-search"><input id="search" placeholder="Tìm bài, từ vựng hoặc nghĩa…" aria-label="Tìm bài"></label></div><div class="vocab-grid" id="cards"></div></section>`;cards('');document.getElementById('search').oninput=e=>cards(e.target.value);}
const lessons=[{title:'Bài từ vựng hiện có',num:'01',tag:false,sub:'BÀI THƯỜNG · MINH HỌA'}, {title:'Contracts',num:'01',tag:true,sub:'GENERAL BUSINESS'}];
function cards(q){document.getElementById('cards').innerHTML=lessons.filter(l=>l.title.toLowerCase().includes(q.toLowerCase())||(l.tag&&'essential word'.includes(q.toLowerCase()))).map(l=>`<article class="vocab-card">${l.tag?'<span class="essential">Essential Word</span>':''}<button class="vocab-coverArea" data-open="${l.tag}" data-title="${l.title}"><span class="vocab-badge vocab-coverBadge">${l.tag?'12':'30'} mục từ</span><div class="vocab-bookCover"><small>ENGLISH SPACE<br>VOCABULARY COLLECTION</small><span>${l.num}</span><strong>${l.title}</strong><small>${l.sub}</small><div>WORDS FOR YOUR NEXT CHAPTER</div></div><span class="vocab-coverHint">KHÁM PHÁ BÀI HỌC ↗</span></button></article>`).join('')||'<p>Không tìm thấy bài.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{isEssential=b.dataset.open==='true';active='list';lesson();});}
function lesson(){root.innerHTML=`<nav class="vocab-breadcrumb"><button id="back">Từ vựng</button><span>/</span><span>${isEssential?'Contracts':'Bài từ vựng hiện có'}</span></nav><section class="vocab-lessonHero"><div><p class="vocab-eyebrow">BÀI 01 · ${isEssential?'GENERAL BUSINESS':'TỪ VỰNG TIẾNG ANH'}</p><h1>${isEssential?'Contracts':'Bài từ vựng hiện có'}</h1>${isEssential?'<span class="essential">Essential Word</span>':''}<p>${isEssential?'12':'30'} mục từ để khám phá.<br>Đọc từ, xem nghĩa và nhấn loa để nghe phát âm.</p></div><span class="vocab-lessonNumber" aria-hidden="true">01</span></section><section class="study-summary"><div><span class="study-eyebrow">TIẾN ĐỘ CỦA BẠN · MINH HỌA</span><strong>0 / ${isEssential?'12':'30'} từ đã nhớ</strong><p>0 từ đã luyện · 0 lượt Writing / Test</p></div><progress max="12" value="0" aria-label="Từ đã nhớ"></progress></section><div class="study-tabs" role="tablist" aria-label="Chế độ học">${[...core,...(isEssential?extras:[])].map(([id,label])=>`<button role="tab" id="tab-${id}" aria-selected="${active===id}" aria-controls="content" data-tab="${id}" class="${extras.some(e=>e[0]===id)?'extra':''}">${label}</button>`).join('')}</div><section class="study-panel" id="content" role="tabpanel" aria-labelledby="tab-${active}"></section>`;document.getElementById('back').onclick=home;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;lesson()});render();}
const el=id=>document.getElementById(id);const hint='<p class="muted">Câu hỏi tự soạn để thử giao diện; bản chính thức sẽ nhập và đối chiếu nội dung sách.</p>';
function render(){let p=el('content');
if(active==='list'){p.innerHTML='<div class="vocab-wordToolbar"><h2>Từ vựng trong bài</h2><span class="muted">3 mục từ minh họa</span></div><ol class="vocab-words">'+words.map(([w,m],i)=>`<li><span class="vocab-wordNumber">0${i+1}</span><div class="vocab-wordContent"><h3 lang="en">${w}</h3><p class="vocab-meaning">${m}</p></div><button class="btn speak-word" data-word="${w}" aria-label="Nghe ${w}">Nghe</button></li>`).join('')+'</ol><p id="voiceNote" class="muted"></p>';p.querySelectorAll('.speak-word').forEach(b=>b.onclick=()=>speak(b.dataset.word));}
if(active==='flashcard'){p.innerHTML=`<h2>Flash Card</h2><p class="muted">${wordIndex+1} / 3 từ mẫu</p><button id="flip" class="flash"><strong>${words[wordIndex][flip?1:0]}</strong><p>Bấm để lật thẻ</p></button><div class="tools"><button class="btn" id="again">Cần ôn lại</button><button class="btn main" id="next">Đã nhớ →</button></div>`;el('flip').onclick=()=>{flip=!flip;render()};el('again').onclick=()=>{errors.add(words[wordIndex][0]);advance()};el('next').onclick=advance;}
if(active==='writing'){p.innerHTML=`<h2>Writing</h2><p>Viết từ tiếng Anh: <strong>${words[wordIndex][1]}</strong></p><form id="write"><input class="field" id="answer" aria-label="Câu trả lời" required autocomplete="off"><div class="tools"><button class="btn main">Kiểm tra</button><button class="btn" type="button" id="next">Từ tiếp theo</button></div></form><div id="result" aria-live="polite"></div>`;el('write').onsubmit=e=>{e.preventDefault();const ok=el('answer').value.trim().toLowerCase()===words[wordIndex][0];if(!ok)errors.add(words[wordIndex][0]);el('result').innerHTML=`<div class="response ${ok?'':'error'}">${ok?'Chính xác!':'Đáp án: '+words[wordIndex][0]+'. Đã thêm vào ôn lỗi sai.'}</div>`};el('next').onclick=advance;}
if(active==='test'){p.innerHTML='<h2>Test · Bài kiểm tra từ vựng</h2>'+hint;quiz(p,[{q:'“Agreement” có nghĩa là gì?',a:['Sự thỏa thuận','Sự đảm bảo','Tuân thủ'],correct:0,why:'Agreement là danh từ chỉ sự thỏa thuận hoặc hợp đồng.'}]);}
if(active==='history'){p.innerHTML='<h2>Lịch sử & ôn lỗi sai</h2><p class="muted">Trong bản mẫu, kết quả chỉ tồn tại khi trang đang mở.</p>'+(errors.size?'<ul>'+[...errors].map(x=>`<li>${x}</li>`).join('')+'</ul><button class="btn main" id="retry">Ôn lại</button>':'<p>Chưa có câu sai. Thử Writing hoặc bài tập trong sách.</p>');if(el('retry'))el('retry').onclick=()=>{active='writing';wordIndex=0;lesson()};}
if(active==='context'){p.innerHTML='<h2>Words in Context</h2>'+hint+'<div class="tools"><span class="essential">agreement</span><span class="essential">assurance</span><span class="essential">abide by</span></div><div class="passage">The two companies reached an <input id="blank1" class="field" aria-label="Chỗ trống 1" size="12">. Both parties must <input id="blank2" class="field" aria-label="Chỗ trống 2" size="12"> its terms.</div><button class="btn main" id="check">Kiểm tra</button><div id="result" aria-live="polite"></div>';el('check').onclick=()=>{let n=0;['agreement','abide by'].forEach((s,i)=>{if(el('blank'+(i+1)).value.trim().toLowerCase()===s)n++;else errors.add(s)});el('result').innerHTML=`<div class="response">${n}/2 đúng. Đáp án: (1) agreement · (2) abide by.<p>“Reach an agreement” là đạt được thỏa thuận; “abide by” là tuân thủ.</p></div>`};}
if(active==='families'){p.innerHTML='<h2>Word Families</h2><p>Các dạng từ trong cùng một họ.</p><table class="families"><thead><tr><th>Động từ</th><th>Danh từ</th><th>Tính từ</th></tr></thead><tbody><tr><td lang="en">agree</td><td lang="en">agreement</td><td lang="en">agreeable</td></tr><tr><td lang="en">obligate</td><td lang="en">obligation</td><td lang="en">obligatory</td></tr><tr><td lang="en">specify</td><td lang="en">specification</td><td lang="en">specific</td></tr></tbody></table><h3>Luyện chọn dạng từ</h3>'+hint;quiz(p,[{q:'The two parties signed an _____ yesterday.',a:['agree','agreement','agreeable'],correct:1,why:'Sau “an” cần danh từ: agreement.'},{q:'Please _____ the delivery date in the contract.',a:['specification','specific','specify'],correct:2,why:'Câu yêu cầu dùng động từ nguyên mẫu: specify.'}]);}
if(active==='reading')reading(p);
if(active==='listening')listening(p);
if(active==='review'){p.innerHTML='<div class="panel-title"><h2>Word Review #1</h2><span class="essential">Bài 01–05 · General Business</span></div><p>Contracts · Marketing · Warranties · Business Planning · Conferences</p><p class="muted">Cùng một bài ôn cho nhóm 5 bài. Nộp toàn bộ để xem kết quả và làm lại câu sai.</p>'+hint;quiz(p,[{q:'The buyer and seller reached an _____.',a:['agreement','agree','agreeable'],correct:0,why:'Cụm danh từ “an agreement”.'},{q:'The warranty _____ repairs for one year.',a:['cover','covers','covering'],correct:1,why:'Chủ ngữ số ít: the warranty covers.'},{q:'Please _____ your attendance at the conference.',a:['confirmation','confirmed','confirm'],correct:2,why:'Sau please cần động từ nguyên mẫu.'}],true);}
}
function advance(){wordIndex=(wordIndex+1)%words.length;flip=false;render()}
function quiz(parent,qs,review=false){const div=document.createElement('div');div.innerHTML=qs.map((q,i)=>`<fieldset class="question" style="border-left:0;border-right:0;border-bottom:0"><legend>${i+1}. ${q.q}</legend>${q.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label>`).join('')}</fieldset>`).join('')+`<button class="btn main" id="submitQuiz">${review?'Nộp bài ôn':'Nộp bài'}</button><div id="quizResult" aria-live="polite"></div>`;parent.appendChild(div);el('submitQuiz').onclick=()=>{const answers=qs.map((_,i)=>div.querySelector(`input[name=q${i}]:checked`));if(answers.some(a=>!a)){el('quizResult').innerHTML='<p class="response error">Bạn hãy trả lời đủ các câu trước khi nộp.</p>';return}let wrong=[];let score=0;el('quizResult').innerHTML=qs.map((q,i)=>{const ok=+answers[i].value===q.correct;if(ok)score++;else{wrong.push(q);errors.add(q.q)}return `<div class="response ${ok?'':'error'}"><strong>Câu ${i+1}: ${ok?'Đúng':'Chưa đúng'} · ${q.a[q.correct]}</strong><p>${q.why}</p></div>`}).join('');el('quizResult').insertAdjacentHTML('afterbegin',`<h3>Kết quả: ${score}/${qs.length} đúng</h3>`);if(wrong.length){const retry=document.createElement('button');retry.className='btn';retry.textContent='Làm lại '+wrong.length+' câu sai';retry.onclick=()=>{div.remove();quiz(parent,wrong,review)};el('quizResult').appendChild(retry)}};}
function reading(p){p.innerHTML='<h2>Reading</h2><div class="tools">'+[5,6,7].map(n=>`<button class="btn ${n===part?'chosen':''}" data-part="${n}">Part ${n}</button>`).join('')+'</div>'+hint;p.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{part=+b.dataset.part;render()});if(part===5){p.insertAdjacentHTML('beforeend','<h3>Incomplete Sentences</h3>');quiz(p,[{q:'All employees must _____ the safety rules.',a:['abide by','assurance','agreement','cancel'],correct:0,why:'Abide by = tuân thủ; vị trí sau must cần động từ.'}]);}if(part===6){p.insertAdjacentHTML('beforeend','<h3>Text Completion</h3><div class="passage"><strong>To: All staff<br>Subject: New service agreement</strong><p>We have signed a new service (1) _____. The supplier will (2) _____ technical support for twelve months.</p></div>');quiz(p,[{q:'Chỗ trống (1)',a:['agree','agreement','agreeable','agreeing'],correct:1,why:'“Service agreement” là hợp đồng dịch vụ.'},{q:'Chỗ trống (2)',a:['provide','provision','provider','provided'],correct:0,why:'Sau will dùng động từ nguyên mẫu provide.'}]);}if(part===7){p.insertAdjacentHTML('beforeend','<h3>Reading Comprehension · Nhóm 2 câu hỏi</h3><div class="passage"><strong>From: Emma Lee<br>To: Purchasing Team<br>Subject: Contract meeting</strong><p>Please review the revised service contract before our meeting on Friday at 10 a.m. The supplier has agreed to provide support for twelve months. Bring any questions about the payment terms to the meeting.</p><p>Emma</p></div>');quiz(p,[{q:'Why did Emma send the email?',a:['To cancel a service','To prepare for a contract meeting','To announce a payment','To hire a supplier'],correct:1,why:'Email yêu cầu xem hợp đồng trước cuộc họp.'},{q:'How long will the supplier provide support?',a:['One month','Six months','One year','Two years'],correct:2,why:'Twelve months = one year.'}]);}}
const listeningData={1:{title:'Photographs',text:'A. The men are signing documents. B. The men are boarding a plane. C. The men are painting a wall. D. The men are serving a meal.',qs:[{q:'Choose the sentence that best describes the picture.',a:['A','B','C','D'],correct:0,why:'Những người trong ảnh đang ký giấy tờ.'}]},2:{title:'Question–Response',text:'When will the contract be ready? A. By Friday afternoon. B. In the conference room. C. It is a new printer.',qs:[{q:'Choose the best response.',a:['A','B','C'],correct:0,why:'When hỏi thời gian; “By Friday afternoon” trả lời đúng trọng tâm.'}]},3:{title:'Conversation',text:'Woman: Our service contract expires next month. Man: Should we renew it? Woman: Yes, but I want to discuss the price first. Man: I will call the supplier this afternoon.',qs:[{q:'What are the speakers discussing?',a:['A service contract','A job interview','A delivery'],correct:0,why:'Người nói đề cập service contract.'},{q:'What will the man do?',a:['Cancel a meeting','Call the supplier','Pay an invoice'],correct:1,why:'Người đàn ông nói sẽ gọi nhà cung cấp chiều nay.'}]},4:{title:'Talk',text:'Good morning, everyone. Please review the agreement before tomorrow’s meeting. We will meet in Room 204 at nine o’clock. Bring your questions about the delivery schedule.',qs:[{q:'When is the meeting?',a:['Today','Tomorrow','Next week'],correct:1,why:'Bài nói nhắc đến tomorrow’s meeting.'},{q:'What should listeners bring?',a:['Payment receipts','Product samples','Questions about delivery'],correct:2,why:'Yêu cầu mang câu hỏi về lịch giao hàng.'}]}};
function listening(p){const d=listeningData[listenPart];p.innerHTML='<h2>Listening</h2><div class="tools">'+[1,2,3,4].map(n=>`<button class="btn ${n===listenPart?'chosen':''}" data-listen="${n}">Part ${n}</button>`).join('')+'</div><h3>'+d.title+'</h3><p class="muted">Transcript và câu hỏi tự soạn để minh họa. Giọng đọc của trình duyệt, không phải audio gốc.</p>'+(listenPart===1?'<div class="part-photo"><img src="/files/listening-source.png" alt="Những người đàn ông ký giấy tờ tại bàn họp; ảnh trích từ trang bài nghe của sách"></div>':'')+'<div class="tools"><button class="btn main" id="play">▶ Nghe minh họa</button><button class="btn" id="stop">Dừng</button><label>Tốc độ <select class="field" id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option></select></label></div><p id="voiceNote" class="muted" aria-live="polite"></p><details><summary>Xem transcript</summary><div class="passage">'+d.text+'</div></details>';p.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();listenPart=+b.dataset.listen;render()});el('play').onclick=()=>speak(d.text,+el('speed').value);el('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();el('voiceNote').textContent='Đã dừng.'};quiz(p,d.qs);}
function speak(text,rate=1){if(!('speechSynthesis'in window)){if(el('voiceNote'))el('voiceNote').textContent='Trình duyệt không hỗ trợ giọng đọc; bạn có thể xem transcript.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.onstart=()=>{if(el('voiceNote'))el('voiceNote').textContent='Đang phát giọng đọc minh họa…'};u.onend=()=>{if(el('voiceNote'))el('voiceNote').textContent='Đã phát xong.'};u.onerror=()=>{if(el('voiceNote'))el('voiceNote').textContent='Không phát được giọng đọc trên trình duyệt này. Hãy xem transcript.'};speechSynthesis.speak(u)}
document.getElementById('home').onclick=document.getElementById('brand').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();home()};home();
</script></body></html>
